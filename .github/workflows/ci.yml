name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_NAME: messenger_db
      DATABASE_PORT: 5432
      DATABASE_HOST: localhost
      DATABASE_PASS: postgres
      DATABASE_USER: messenger_user

      TEST_DATABASE_NAME: messenger_test_db

      SECRET_KEY: secret_key

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: messenger_user
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: messenger_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync

      - name: Create test database
        run: |
          PGPASSWORD="$DATABASE_PASS" psql \
            -h "$DATABASE_HOST" \
            -p "$DATABASE_PORT" \
            -U "$DATABASE_USER" \
            -d "$DATABASE_NAME" \
            -c "CREATE DATABASE $TEST_DATABASE_NAME;"

      - name: Run migrations
        run: bash ./scripts/migrate.sh

      - name: Run tests
        run: uv run pytest